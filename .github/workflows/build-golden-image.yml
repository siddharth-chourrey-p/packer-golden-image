name: Build golden image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - packer-golden-image/**

permissions:
  id-token: write
  contents: read

env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  build-golden-image:
    name: "Packer & Ansible Image Build"
    runs-on: ubuntu-latest

    steps:
      # 1. OIDC Login to Azure (Zero Secrets)
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

     # 3. HashiCorp Packer Setup
      - name: Setup HashiCorp Packer
        uses: hashicorp/setup-packer@main
        with:
          version: "latest"

        
      # 5. Packer Plugins Initialize
      - name: Packer Init
        run: packer init ubuntu-golden-image.pkr.hcl

        # 6. Packer Syntax Validation
      - name: Packer Validate
        run: packer validate ubuntu-golden-image.pkr.hcl

        # 7. Execute Packer Build (Banaega Golden Image Azure me)
      - name: Packer Build Image
        run: packer build ubuntu-golden-image.pkr.hcl